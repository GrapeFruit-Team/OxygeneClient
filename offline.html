<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxygène</title>
    <style>
        :root {
            --primary-color: #6a5acd;
        }

        body {
            display: flex;
            background-color: #0d0d0d;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
    
        .logo img {
            max-width: 300px;
            width: 100%;
            height: auto;
            animation: pulseOpacity 2s ease-in-out infinite;
        }

        .loading-dots {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--primary-color);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulseOpacity {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
        }

        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo-container">
            <div class="logo">
                <img src="img/purplify-logo.png">
            </div>
        </div>
        
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        setInterval(async () => {
            try {
                const online = await fetch('https://oxygene.grfruit.ru', { method: 'HEAD' });
                if (online.ok) {
                    ipcRenderer.send('online-detected');
                }
            } catch (e) {
            }
        }, 3000);
    </script>
</body>
</html>
