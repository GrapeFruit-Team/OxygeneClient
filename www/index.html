
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <title>Oxygène</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0d0d0d;
        }

        #loader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0d0d0d;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <iframe
        id="app"
        src="https://oxygene.grfruit.ru/mobile"
        allow="autoplay; camera; microphone; geolocation; clipboard-read; clipboard-write"
    ></iframe>

    <iframe
        id="loader"
        src="loading.html"
        aria-label="Загрузка Oxygène"
    ></iframe>

    <script>
        const app = document.getElementById('app');
        const loader = document.getElementById('loader');

        let hidden = false;

        function hideLoader() {
            if (hidden) return;
            hidden = true;

            loader.classList.add('hidden');

            setTimeout(() => {
                loader.remove();
            }, 450);
        }

        app.addEventListener('load', () => {
            setTimeout(hideLoader, 1200);
        });

        setTimeout(hideLoader, 25000);
    </script>

</body>
</html>
