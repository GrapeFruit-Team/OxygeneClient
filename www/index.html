<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Oxygène</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1E90FF;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<iframe src="https://oxygene.grfruit.ru/mobile"></iframe>

<script type="module">
    import { StatusBar, Style } from '@capacitor/status-bar';

    async function configureStatusBar() {
        try {
            await StatusBar.setOverlaysWebView({ overlay: false });
            await StatusBar.setBackgroundColor({ color: '#1E90FF' });
            await StatusBar.setStyle({ style: Style.Light });
        } catch (error) {
            console.error('StatusBar error:', error);
        }
    }

    configureStatusBar();
</script>

</body>
</html>
