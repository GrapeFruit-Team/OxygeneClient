
workflows:
  ios-build:
    name: Oxygène iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      vars:
        APP_ID: com.grfruit.purplify

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Add iOS platform if missing
        script: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Build iOS
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/**/Build/**/*.app
      - build/**/*.ipa
